name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: requirements*.txt in sync with uv.lock
        run: |
          uv export -q --format requirements-txt --no-hashes --no-dev -o requirements.txt
          uv export -q --format requirements-txt --no-hashes -o requirements-dev.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

      - name: CLI smoke
        run: uv run python main.py --help
